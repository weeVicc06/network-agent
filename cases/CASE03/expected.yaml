schema_version: '0.2'
name: RIP三角形VLSM对比
environment: packet_tracer
vlans:
- id: 1
  name: default
devices:
- id: PC0
  type: pc
  model: PC-PT
  interfaces:
  - name: FastEthernet0
    ipv4: 192.168.16.1/25
    mode: routed
  gateway: 192.168.16.126
- id: PC1
  type: pc
  model: PC-PT
  interfaces:
  - name: FastEthernet0
    ipv4: 192.168.16.129/26
    mode: routed
  gateway: 192.168.16.190
- id: R0
  type: router
  model: '2911'
  interfaces:
  - name: GigabitEthernet0/0
    ipv4: 192.168.16.126/25
    mode: routed
  - name: GigabitEthernet0/1
    ipv4: 10.0.0.1/30
    mode: routed
  - name: GigabitEthernet0/2
    ipv4: 30.0.0.1/30
    mode: routed
  routing:
    protocol: rip
    version: 2
    auto_summary: false
    networks:
    - prefix: 192.168.16.0/25
    - prefix: 10.0.0.0/30
    - prefix: 30.0.0.0/30
- id: R1
  type: router
  model: '2911'
  interfaces:
  - name: GigabitEthernet0/0
    ipv4: 192.168.16.190/26
    mode: routed
  - name: GigabitEthernet0/1
    ipv4: 20.0.0.1/30
    mode: routed
  - name: GigabitEthernet0/2
    ipv4: 30.0.0.2/30
    mode: routed
  routing:
    protocol: rip
    version: 2
    auto_summary: false
    networks:
    - prefix: 192.168.16.128/26
    - prefix: 20.0.0.0/30
    - prefix: 30.0.0.0/30
- id: R2
  type: router
  model: '2911'
  interfaces:
  - name: GigabitEthernet0/0
    ipv4: 10.0.0.2/30
    mode: routed
  - name: GigabitEthernet0/1
    ipv4: 20.0.0.2/30
    mode: routed
  routing:
    protocol: rip
    version: 2
    auto_summary: false
    networks:
    - prefix: 10.0.0.0/30
    - prefix: 20.0.0.0/30
links:
- a:
    device: PC0
    interface: FastEthernet0
  b:
    device: R0
    interface: GigabitEthernet0/0
- a:
    device: PC1
    interface: FastEthernet0
  b:
    device: R1
    interface: GigabitEthernet0/0
- a:
    device: R0
    interface: GigabitEthernet0/1
  b:
    device: R2
    interface: GigabitEthernet0/0
- a:
    device: R1
    interface: GigabitEthernet0/1
  b:
    device: R2
    interface: GigabitEthernet0/1
- a:
    device: R0
    interface: GigabitEthernet0/2
  b:
    device: R1
    interface: GigabitEthernet0/2
acls: []
checks:
- kind: ping
  source: PC0
  destination: PC1
  reachable: true
- kind: ping
  source: PC1
  destination: PC0
  reachable: true
- kind: route
  source: R0
  prefix: 192.168.16.128/26
  protocol: rip
  next_hop: 30.0.0.2
- kind: route
  source: R1
  prefix: 192.168.16.0/25
  protocol: rip
  next_hop: 30.0.0.1
